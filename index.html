<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>WriteFlow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Shantell+Sans:wght@400;500&family=Atma:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Serif+Bengali:wght@400;600&family=LXGW+WenKai+TC&display=swap">
<style>
/* Layout: the page changes material as the writing matures — pencil sketch on ivory (draft), structured notes (shape), APA 7 student paper on white (final). Controls stay in one legible sans throughout. */
:root{
  --paper:#F7F5EF; --page:#FFFFFF; --card:#FFFFFF; --sunk:#EFECE3;
  --ink:#2B2A26; --ink-final:#1A1A1A; --muted:#5F6B78; --pencil:#4A5560; --line:#D6D3CA; --rule:#1A1A1A;
  --navy:#1F3A5F; --navy-ink:#FFFFFF; --navy-soft:#DCE4EE;
  --bubble:#E8EEF5; --bubble-line:#8FA3BA; --write-line:#B8C4D2;
  --hl:#FBE38A; --hl-line:#E3C24F; --spark:#F2C94C; --spark-line:#D9A21B;
  --zone-unsure:#EFEBDF; --zone-archive:#E7E3D6; --grid-dot:#DDD8CB;
  --rec:#9C3B2E; --ok:#3F6B3A; --shadow:rgba(40,40,30,.12); --toast-bg:#1F3A5F; --toast-ink:#FFFFFF;
  --s0:#3E6690; --s1:#2F7A74; --s2:#A0661E; --s3:#74508F; --s4:#56782F; --s5:#9C4A35;
  --f-ui:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-draft:"Shantell Sans","Atma","LXGW WenKai TC","Comic Neue",system-ui,sans-serif;
  --f-shape:"Source Serif 4","Noto Serif Bengali","LXGW WenKai TC",Georgia,serif;
  --f-final:"Times New Roman",Times,"Liberation Serif","Noto Serif Bengali",serif;
  --f-brand:"Source Serif 4",Georgia,serif;
  --f-mono:ui-monospace,Menlo,Consolas,monospace;
  --wob:255px 12px 225px 12px/12px 225px 12px 255px;
  --wob-lg:22px 8px 18px 10px/10px 18px 8px 22px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C1D1A; --page:#161715; --card:#24262A; --sunk:#2A2C2E;
    --ink:#E9E6DC; --ink-final:#F0EEE8; --muted:#A6AEB8; --pencil:#9AA4AE; --line:#3B3D3F; --rule:#C9C6BE;
    --navy:#A9C1E0; --navy-ink:#13171D; --navy-soft:#2A3442;
    --bubble:#232C38; --bubble-line:#5B6F87; --write-line:#4A5868;
    --hl:#6E5B17; --hl-line:#A88A2A; --spark:#E8C04A; --spark-line:#C79A1E;
    --zone-unsure:#23241F; --zone-archive:#1F201C; --grid-dot:#34352F;
    --rec:#D98C74; --ok:#8BC28A; --shadow:rgba(0,0,0,.45); --toast-bg:#A9C1E0; --toast-ink:#13171D;
    --s0:#86A9D3; --s1:#6BBFB7; --s2:#D9A85C; --s3:#B79AD3; --s4:#9DC57E; --s5:#DC9278;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C1D1A; --page:#161715; --card:#24262A; --sunk:#2A2C2E;
  --ink:#E9E6DC; --ink-final:#F0EEE8; --muted:#A6AEB8; --pencil:#9AA4AE; --line:#3B3D3F; --rule:#C9C6BE;
  --navy:#A9C1E0; --navy-ink:#13171D; --navy-soft:#2A3442;
  --bubble:#232C38; --bubble-line:#5B6F87; --write-line:#4A5868;
  --hl:#6E5B17; --hl-line:#A88A2A; --spark:#E8C04A; --spark-line:#C79A1E;
  --zone-unsure:#23241F; --zone-archive:#1F201C; --grid-dot:#34352F;
  --rec:#D98C74; --ok:#8BC28A; --shadow:rgba(0,0,0,.45); --toast-bg:#A9C1E0; --toast-ink:#13171D;
  --s0:#86A9D3; --s1:#6BBFB7; --s2:#D9A85C; --s3:#B79AD3; --s4:#9DC57E; --s5:#DC9278;
  color-scheme:dark;
}

/* Phase tokens */
body{--bg:var(--paper);--f-content:var(--f-draft);--box:var(--card);--box-border:1.5px solid var(--pencil);--box-r:var(--wob);--panel-r:var(--wob-lg);--content-ink:var(--ink)}
body[data-phase="shape"]{--f-content:var(--f-shape);--box-border:1px solid var(--line);--box-r:4px;--panel-r:4px}
body[data-phase="final"]{--bg:var(--page);--f-content:var(--f-final);--box-border:1px solid var(--line);--box-r:0px;--panel-r:2px;--content-ink:var(--ink-final)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.55;transition:background-color .7s ease;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.app{max-width:1100px;margin:0 auto;padding-block:16px 110px}
body.wide .app{max-width:1840px}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.s0{--src:var(--s0)}.s1{--src:var(--s1)}.s2{--src:var(--s2)}.s3{--src:var(--s3)}.s4{--src:var(--s4)}.s5{--src:var(--s5)}
.morphable{transition:border-radius .55s ease,border-color .55s ease,background-color .6s ease,border-width .55s ease}

/* Highlighter: a real stroke in draft, a thin underline in shape, gone in final */
.hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 88%;background-size:100% 52%;padding:0 .12em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .55s ease}
body[data-phase="shape"] .hl{background-image:linear-gradient(var(--hl-line),var(--hl-line));background-size:100% 2px;background-position:0 96%}
body[data-phase="final"] .hl{background-size:0 2px;padding:0}

/* Header */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:8px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wordmark{font-family:var(--f-brand);font-style:italic;font-weight:600;font-size:1.5rem;color:var(--navy);letter-spacing:.005em}
.sub{color:var(--muted);font-size:.85rem}
#rail{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.rail-done{font-size:.78rem;color:var(--muted);padding:3px 10px;border-radius:999px;background:var(--sunk)}
.rail-done::before{content:"✓ ";color:var(--ok);font-weight:700}
.rail-now{font-size:.78rem;font-weight:700;color:var(--navy-ink);background:var(--navy);padding:3px 10px;border-radius:999px}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* Buttons (UI font, every phase) */
.primary,.secondary,.ghost-btn,.icon-btn{font-family:var(--f-ui)}
.primary{background:var(--navy);color:var(--navy-ink);border:1.5px solid var(--navy);border-radius:var(--box-r);padding:10px 20px;font-weight:700}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:transparent;color:var(--navy);border:1.5px solid var(--navy);border-radius:var(--box-r);padding:9px 16px;font-weight:700}
.secondary:disabled{opacity:.45;cursor:not-allowed}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:.9rem;cursor:pointer}
.ghost-btn[aria-pressed="true"]{border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
.ghost-btn:disabled{opacity:.45;cursor:not-allowed}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0;justify-self:start;font-family:var(--f-ui)}
.icon-btn{min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);border-radius:8px;color:var(--ink);font-size:1rem}
.icon-btn:disabled{opacity:.35;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}

/* Stage frame */
#main{transition:opacity .22s ease,transform .22s ease}
#main.morph-fade{opacity:0;transform:translateY(-4px)}
#main.morph-in{animation:morphIn .45s ease both}
@keyframes morphIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stage{display:grid;gap:22px;padding-top:28px}
.stage-head{max-width:70ch}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:0 0 6px}
h1{font-family:var(--f-content);font-weight:500;font-size:clamp(1.6rem,3vw,2.15rem);line-height:1.2;margin:0 0 8px;color:var(--content-ink);text-wrap:balance}
body[data-phase="shape"] h1{font-style:italic;font-weight:400;color:var(--navy);border-left:3px solid var(--navy);padding-left:12px}
body[data-phase="final"] h1{font-weight:700;font-size:clamp(1.4rem,2.4vw,1.75rem)}
.lede{margin:0;color:var(--muted);max-width:68ch}
.panel{background:var(--box);border:var(--box-border);border-radius:var(--panel-r);padding:20px;display:grid;gap:12px;min-width:0}
.current{transition:transform .26s ease,opacity .26s ease}
body[data-phase="shape"] .current{border-left:3px solid var(--navy);border-radius:0 4px 4px 0}
.current.folding{transform:translateX(-22px) scale(.985);opacity:0}
.field-label{font-weight:700;font-size:.9rem;font-family:var(--f-ui)}
textarea,input[type="text"],select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
select{font-family:var(--f-ui)}
textarea,input[type="text"].content{font-family:var(--f-content);font-size:1.02rem;color:var(--content-ink)}
body[data-phase="draft"] textarea{border:1.5px solid var(--pencil);border-radius:var(--wob-lg)}
body[data-phase="shape"] textarea{background:transparent;border:0;border-bottom:1.5px dashed var(--write-line);border-radius:0;padding:8px 2px;
  background-image:repeating-linear-gradient(transparent 0 calc(1.6em - 1px),var(--line) calc(1.6em - 1px) 1.6em);background-position:0 8px;line-height:1.6}
body[data-phase="final"] textarea{border-radius:0;border-color:var(--line);line-height:2}
textarea{resize:vertical;line-height:1.55}
textarea::placeholder,input::placeholder{color:var(--muted);opacity:.85;font-style:italic}
input[type="checkbox"]{accent-color:var(--navy);width:18px;height:18px;margin-top:2px;flex:none}
.example-flag{margin:0;font-size:.85rem;color:var(--muted);background:var(--sunk);padding:6px 10px;border-radius:8px;justify-self:start}
.example-flag b{color:var(--ink)}
.reminder{margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;max-width:76ch;font-family:var(--f-content)}
.mini{display:block;font-family:var(--f-ui);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:2px}
.count{margin:0;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.note{margin:0;font-size:.85rem;color:var(--muted)}

/* Source chips */
.src-chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.src-chip{font-family:var(--f-ui);font-size:.8rem;background:var(--sunk);border-radius:999px;padding:2px 10px 2px 8px;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.src-chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--src)}
.cite-inline{display:none}

/* Source map: a big board with zoom */
.map-grid{display:grid;gap:12px}
.map-top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px 28px;align-items:end}
.map-intro{display:grid;gap:14px;min-width:0}
@media (max-width:900px){.map-top{grid-template-columns:1fr}}
.map-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.zoom{display:flex;gap:6px;align-items:center}
.zoom output{min-width:3.6em;text-align:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.board-wrap{overflow:auto;border:1.5px solid var(--pencil);border-radius:var(--wob-lg);background:var(--paper);width:100%;height:max(540px,calc(100vh - 150px));overscroll-behavior:contain}
.board-sizer{position:relative}
.board{position:absolute;left:0;top:0;transform-origin:0 0;background-color:var(--paper);background-image:radial-gradient(var(--grid-dot) 1.2px,transparent 1.2px);background-size:26px 26px}
.zone{position:absolute;pointer-events:none}
.zone.unsure{background:var(--zone-unsure);border-left:1.5px dashed var(--pencil)}
.zone.archive{background:var(--zone-archive);border-top:1.5px dashed var(--pencil)}
.zone-label{position:absolute;top:10px;left:14px;font-family:var(--f-ui);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hull{position:absolute;border:1.5px dashed var(--navy);border-radius:var(--wob-lg);background:transparent;pointer-events:none;z-index:1}
.hints{position:absolute;left:0;top:0;pointer-events:none;z-index:1;overflow:visible}
.hints line{stroke:var(--navy);stroke-width:1.2;stroke-dasharray:2 6;opacity:.6}
.hints text{fill:var(--muted);font-size:12px;font-family:var(--f-ui)}
.item{position:absolute;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;z-index:2}
.item.dragging{z-index:20;cursor:grabbing;transform:rotate(-1.5deg) scale(1.03);filter:drop-shadow(0 8px 14px var(--shadow))}
.item.in-archive{opacity:.55}
.card{width:208px;background:var(--card);border:1.5px solid var(--pencil);border-radius:var(--wob);padding:9px 28px 11px 12px;transition:transform .2s ease,border-color .2s ease}
.card .src{font-family:var(--f-ui);font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.card .src::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--src);flex:none}
.ctext{margin:4px 0 0;font-family:var(--f-draft);font-size:.86rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.ctext .hl{background-size:100% 42%}
.card.mentioned{transform:scale(1.03)}
.card.near,.stack.near .bubble{border-color:var(--navy);border-style:dashed}
.card.near{transform:scale(1.01)}
.mini-btn{position:absolute;top:4px;right:4px;border:0;background:none;color:var(--muted);font-size:.85rem;padding:2px 5px;border-radius:4px;line-height:1.2;font-family:var(--f-ui)}
.mini-btn:hover{background:var(--sunk);color:var(--ink)}
.stack{width:236px}
.bubble{position:relative;background:var(--bubble);color:var(--navy);border:1.5px solid var(--bubble-line);border-radius:var(--wob);padding:9px 13px;margin-bottom:8px;transition:border-color .2s ease}
.btext{margin:0;font-family:var(--f-draft);font-size:.95rem;line-height:1.45;padding-right:44px;overflow-wrap:anywhere;min-height:1.3em}
.btext u{text-decoration:none;border-bottom:1.8px solid var(--navy)}
.btext[contenteditable="true"]{outline:2px solid var(--navy);outline-offset:2px;background:var(--card);cursor:text;user-select:text;-webkit-user-select:text;border-radius:4px}
.b-tools{position:absolute;top:4px;right:6px;display:flex;gap:2px}
.b-tools .mini-btn{position:static}
.under{list-style:none;margin:0;padding:0 0 0 14px;display:grid;gap:4px}
.chip-card{background:var(--card);border:1px solid var(--pencil);border-radius:var(--wob);padding:3px 10px;font-family:var(--f-draft);font-size:.76rem;line-height:1.35;cursor:grab;touch-action:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.chip-card::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--src);flex:none}
.chip-card b{font-weight:400;font-family:var(--f-ui);color:var(--muted)}
.chip-card.mentioned{border-color:var(--navy);border-width:1.8px}
.map-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.talk{display:grid;gap:8px}
.talk-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.board-hint{margin:0;font-size:.84rem;color:var(--muted)}

/* Feedback 1: a new bubble pops and sparkles */
.bubble.pop{animation:bubPop 1.1s ease-out}
@keyframes bubPop{0%{transform:scale(.85);opacity:0}18%{transform:scale(1.08);opacity:1;border-color:var(--spark-line)}40%{transform:scale(1)}100%{border-color:var(--bubble-line)}}
.bubble.pop-quiet{animation:bubQuiet .35s ease-out}
@keyframes bubQuiet{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.halo{position:absolute;inset:-2px;border:1.5px dashed var(--spark);border-radius:var(--wob);animation:halo .8s ease-out forwards;pointer-events:none}
@keyframes halo{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.18,1.6);opacity:0}}
.sp{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;pointer-events:none;opacity:0;animation:burst .9s ease-out forwards}
.sp svg{display:block}
.sp path{fill:var(--spark);stroke:var(--spark-line);stroke-width:.5}
@keyframes burst{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(var(--s,1)) rotate(25deg);opacity:0}}

/* Feedback 2: a named card gets a pencil loop */
.loop{position:absolute;overflow:visible;pointer-events:none;z-index:3}
.loop path{fill:none;stroke:var(--navy);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw .55s ease-in-out forwards;animation-delay:var(--d,0ms)}
.loop.static path{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}

/* Feedback 3: a gentle snap when a stack forms */
.bubble.clack{animation:clack .25s ease-out}
@keyframes clack{0%{transform:scale(1.01)}40%{transform:scale(.99) translateY(1px)}100%{transform:none}}
.chip-card.snapped{animation:snap .3s cubic-bezier(.3,1.25,.5,1)}
@keyframes snap{0%{transform:translateY(-5px) scale(1.04)}65%{transform:translateY(.5px) scale(.99)}100%{transform:none}}

/* Writing stroke on primary buttons (draft and shape phases) */
.primary{position:relative}
.scribble{position:absolute;left:9%;bottom:4px;width:82%;height:10px;overflow:visible;pointer-events:none}
.scribble path{fill:none;stroke:var(--hl);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--L);stroke-dashoffset:var(--L);animation:draw .34s ease-out forwards}

/* Filing cabinet: finished paragraphs are filed as folders; the drawer stays open a crack so their tabs show. */
.filing{position:relative;z-index:2;pointer-events:none;will-change:transform,opacity}
.cabinet{position:relative;width:100%;max-width:260px;padding-top:34px}
.drawer{position:relative;z-index:0;height:34px;margin:0 10px;overflow:hidden;background:var(--sunk);border:1px solid var(--pencil);border-bottom:0;display:flex;align-items:flex-start;gap:3px;padding:10px 8px 0;transition:height .22s ease}
.cabinet.open .drawer,.peeking .drawer{height:66px}
.ftab{position:relative;flex:1 1 0;min-width:0;height:56px;background:var(--card);border:1px solid var(--bubble-line);border-bottom:0;border-radius:4px 4px 0 0;padding:3px 6px;font-family:var(--f-shape);font-style:italic;font-size:.74rem;color:var(--navy)}
.ftab span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ftab.s2::before,.ftab.s3::before,.ftab.s3::after{content:"";position:absolute;left:3px;right:-3px;top:-4px;height:12px;border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;background:var(--card);z-index:-1}
.ftab.s3::after{left:6px;right:-6px;top:-8px}
.ftab.new{animation:tabUp .38s cubic-bezier(.3,1.3,.5,1)}
@keyframes tabUp{from{transform:translateY(34px)}to{transform:none}}
.cab-front{position:relative;height:84px;background:var(--card);border:1px solid var(--pencil);border-radius:3px;display:grid;place-items:center;align-content:center;gap:8px;transform-origin:50% 0;transition:transform .22s ease}
.cabinet.open .cab-front,.peeking .cab-front{transform:translateY(5px) scale(1.03)}
.cab-front.settle{animation:settle .3s ease-in}
@keyframes settle{0%{transform:translateY(5px) scale(1.03)}80%{transform:translateY(-1px) scale(.995)}100%{transform:none}}
.holder{border:1px solid var(--pencil);background:var(--paper);padding:3px 10px;font-size:.78rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.holder b{color:var(--navy)}

.cab-body{position:relative;height:64px;border:1px solid var(--pencil);border-top:0;background:var(--card)}
.cab-body::after{content:"";position:absolute;left:50%;top:26px;width:56px;height:9px;margin-left:-28px;border:1.5px solid var(--line);border-top:0;border-radius:0 0 9px 9px}

/* Focus stages with frosted stack */
.focus{display:grid;grid-template-columns:minmax(200px,270px) minmax(0,1fr);gap:24px;align-items:start}

.peeking .frost-text{filter:none}
.peeking .frost-card{height:auto;margin-top:6px}
.peeking .frost-card:first-child{margin-top:0}
.stack-note{margin:0;font-size:.85rem;color:var(--muted)}
.stack-empty{color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:4px;padding:14px;margin:0}
.group-name{font-family:var(--f-content);font-style:italic;font-size:1.3rem;margin:0;color:var(--navy);overflow-wrap:anywhere}

/* Points */
.points{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.point{display:grid;gap:6px;padding-left:12px;border-left:3px solid var(--navy-soft);min-width:0}

.pt-meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.pt-link{color:var(--navy);font-weight:700}
.pt-link::before{content:"↳ "}

/* Chunks & links */
.chunks{list-style:none;margin:0;padding:0;display:grid;min-width:0}
.chunk{display:grid;gap:10px;padding:14px 16px;border:var(--box-border);border-radius:var(--panel-r);background:var(--card);min-width:0}
.chunk-head{display:flex;gap:10px;align-items:flex-start;min-width:0}
.chunk-head .pt-text{flex:1;min-width:0;padding-top:3px}
.picks{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.picks legend{font-family:var(--f-ui);font-size:.85rem;font-weight:700;padding:0;margin-bottom:6px;float:left;width:100%}
.pick{position:relative;cursor:pointer;font-family:var(--f-ui)}
.pick input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.pick span{display:inline-block;font-size:.85rem;line-height:1.3;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.pick:hover span{border-color:var(--navy)}
.pick input:checked + span{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:700}
.pick input:focus-visible + span{outline:2px solid var(--navy);outline-offset:2px}
.link-row{margin-left:22px;padding:12px 0 12px 22px;border-left:2px dashed var(--navy);display:grid;gap:8px;min-width:0}
.phrases{margin:0;font-size:.85rem;color:var(--muted);font-family:var(--f-ui)}
.phrases i{font-family:var(--f-content);color:var(--ink)}

.chunk-status{margin:0;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Outline cards */
.outline{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.o-item{display:grid;gap:8px;min-width:0}

.o-top{display:flex;align-items:center;gap:10px;min-width:0}
.o-num{font-family:var(--f-ui);font-size:.85rem;color:var(--navy);border:1.5px solid var(--navy);width:28px;height:28px;display:grid;place-items:center;flex:none;border-radius:50%}
.o-label{font-family:var(--f-content);font-weight:600;font-size:1.15rem;margin:0;flex:1;min-width:0;color:var(--navy);overflow-wrap:anywhere}
.move{display:flex;gap:4px;flex:none}
.o-topic{margin:0;font-family:var(--f-content);font-weight:600;overflow-wrap:anywhere}
.o-close{margin:0;font-family:var(--f-content);color:var(--muted);overflow-wrap:anywhere}
.connector{margin-left:13px;padding-left:24px;border-left:2px dashed var(--line);display:grid;gap:6px;padding-block:4px}
.conn-show{margin:0 0 0 13px;padding:4px 0 4px 24px;border-left:2px dashed var(--line);color:var(--muted);font-size:.92rem;font-family:var(--f-content)}
.reveal .o-card{animation:unfrost .55s ease both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes unfrost{from{filter:blur(6px);opacity:.55}to{filter:none;opacity:1}}
input.group-label{font-family:var(--f-content);font-weight:700;font-size:1.05rem;color:var(--content-ink)}

/* Final phase: the outline is set on a white page in Times New Roman. It stays an outline:

.paper{position:relative;background:var(--page);border:1px solid var(--line);box-shadow:0 2px 14px var(--shadow);padding:52px clamp(18px,6vw,64px) 44px;max-width:900px;width:100%;justify-self:center;font-family:var(--f-final);color:var(--ink-final);display:grid;gap:14px;line-height:1.6}
.paper .pg{position:absolute;top:20px;right:26px;margin:0;font-size:.95rem}

.paper .outline{gap:20px}

.paper .o-label{font-family:var(--f-final);font-weight:700;color:var(--ink-final);font-size:1.05rem}
.o-lab{font-style:italic}
.paper .o-topic,.paper .o-close{margin:0;padding-left:2em;font-family:var(--f-final);font-weight:400;color:var(--ink-final)}
.o-points{list-style:none;margin:0;padding:0 0 0 2em;display:grid;gap:3px}
.o-point{display:grid;grid-template-columns:1.6em minmax(0,1fr)}
.o-letter{font-weight:700}
.o-purpose{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.o-link{padding-left:1.6em;font-family:var(--f-ui);font-size:.8rem;color:var(--navy)}
.paper .connector{font-family:var(--f-ui);line-height:1.5}
.paper-landing{display:grid;gap:6px;font-family:var(--f-ui);line-height:1.5;border-top:1px solid var(--rule);padding-top:14px}

/* Review & revise */
.rv-step{display:flex;gap:14px;align-items:flex-start;margin-top:14px}

.rv-head{margin-top:12px}
.rv-topic,.rv-synth{padding-left:calc(2em + 8px)}
.rv-chunk{padding-left:calc(2em + 8px)}
.rv-clink{padding-left:calc(3.6em + 8px);font-family:var(--f-ui);font-size:.82rem;color:var(--navy)}
.rv-plink{font-family:var(--f-ui);font-size:.82rem;color:var(--navy);text-align:center}
.rv-landing{margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.rv-lab{font-style:italic}
.rv-letter{font-weight:700;display:inline-block;width:1.6em}
.rv-purpose{font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.flag-note{margin:0 0 4px calc(2em + 8px);padding:3px 10px;border-left:2px solid var(--rec);font-family:var(--f-ui);font-size:.86rem;line-height:1.5;color:var(--ink);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.flag-form{margin:4px 0 10px calc(2em + 8px);padding:12px 14px;border:1px solid var(--line);border-radius:6px;background:var(--card);display:grid;gap:8px;font-family:var(--f-ui);line-height:1.5}
.err{margin:0;color:var(--rec);font-size:.86rem;font-family:var(--f-ui)}
.traces{list-style:none;margin:0;padding:0;display:grid;gap:14px}

.dec-picks{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}

.dec:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}

.globals{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:14px}
.global{border:1px solid var(--line);border-top:3px solid var(--line);background:var(--card);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.global.done{border-top-color:var(--ok)}

.gl-list{margin:0;padding-left:1.1em;display:grid;gap:4px}
.gl-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gl-rel{font-family:var(--f-ui);font-size:.78rem;color:var(--navy);border:1px solid var(--bubble-line);border-radius:999px;padding:1px 8px}
.gl-status{margin:0}
.rv-break{margin:0;padding:10px 14px;border-left:3px solid var(--navy);background:var(--sunk);font-size:.92rem;max-width:72ch}
.rv-edit .o-card.edit{background:var(--card)}

/* Decision marks */
.marks{display:grid;gap:10px;padding:12px 16px;background:var(--sunk);border-radius:8px;min-width:0;font-family:var(--f-ui);line-height:1.5}
.mark-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mark{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start}
.mark-tags{display:flex;gap:4px;flex-wrap:wrap}

.pill.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.mark-form{display:grid;gap:8px}
.mf-row{display:flex;flex-wrap:wrap;gap:10px}
.mf-row label{display:grid;gap:4px;font-size:.85rem;font-weight:700;flex:1 1 180px;min-width:0}
.mf-why{display:grid;gap:4px;font-size:.85rem;font-weight:700}
.mark-form .secondary{justify-self:start}

/* Explain + revise */
.panel-title{font-family:var(--f-content);font-weight:600;margin:0;font-size:1.12rem;color:var(--navy)}

.checklist ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checklist label{display:flex;gap:8px;align-items:flex-start}
.o-card.edit{gap:10px;font-family:var(--f-ui);line-height:1.55}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}

/* Completion cue */
#cue{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;width:max-content;max-width:calc(100% - 32px);font-weight:700;z-index:30;box-shadow:0 6px 20px var(--shadow)}

/* Research log drawer */
#logpanel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--card);border-left:1px solid var(--line);
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;
  overflow:auto;z-index:40;box-shadow:-8px 0 24px var(--shadow);display:grid;gap:14px;align-content:start;font-family:var(--f-ui)}

.live-cap.idle{color:var(--muted);font-style:italic;font-family:var(--f-ui)}

.styles legend{font-weight:700;font-size:.95rem;margin-bottom:6px;padding:0}
.style-opt{display:grid;gap:8px;border:1.5px solid var(--line);border-radius:var(--wob-lg);padding:14px 16px;background:var(--card);cursor:pointer;min-width:0}

.style-top{display:flex;gap:8px;align-items:baseline;font-weight:700}
.style-top input{accent-color:var(--navy)}
.style-use{margin:0;color:var(--muted);font-size:.92rem}
.guide{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.95rem}
.guide li{display:grid;gap:1px}
.guide code{font-family:var(--f-final);font-size:1.02rem;background:var(--sunk);padding:1px 6px;border-radius:3px}

.info-card{background:var(--card);border:1.5px solid var(--pencil);border-radius:var(--wob-lg);padding:16px 18px;display:grid;gap:10px;align-content:start;min-width:0;position:relative}
.info-card::before{content:"";position:absolute;top:14px;right:16px;width:10px;height:10px;border-radius:50%;background:var(--src)}
.ic-cite{display:grid;gap:4px;min-width:0}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;margin:0;padding:0;font-size:.95rem}

(function(){

/* =========================================================

/* Paragraph structure. A chunk is one bubble with the sources stacked under it.
   The outline fixes only the structure: what each chunk does and how it links to the one before.
   Signal phrases are shown for later drafting and are never inserted into the outline. */
const PURPOSES = [
  {id:'common',    name:'Common finding'},
  {id:'evidence',  name:'Adds evidence'},
  {id:'different', name:'Different view'},
  {id:'qualify',   name:'Qualifies'},
  {id:'evaluate',  name:'My evaluation'},
  {id:'gap',       name:'Points to a gap'}
];
const RELATIONS = [
  {id:'similar',  name:'Similar',      phrases:['Similarly, …','Likewise, …','X also finds …','Consistent with X, …']},
  {id:'contrast', name:'Contrast',     phrases:['In contrast, …','Whereas X …, Y …','Unlike X, Y …','However, …']},
  {id:'concede',  name:'Concession',   phrases:['Although X …, Y convincingly shows …','While X …, …']},
  {id:'extend',   name:'Extends',      phrases:['Building on this, …','Furthermore, …','X goes further: …']},
  {id:'explain',  name:'Explains why', phrases:['One reason is …','This may be because …','X helps explain this: …']}
];
function relName(id){ const r = RELATIONS.find(x=>x.id===id); return r ? r.name : ''; }
function purposeLabel(pt){
  const u = PURPOSES.find(x=>x.id===pt.purposeId), note = String(pt.purposeNote || '').trim();
  return u && note ? u.name + ': ' + note : (u ? u.name : note);
}

/* =========================================================
   AI ADAPTER CONTRACT (all async)
   parseReference({text}) -> {authors:[{last,given}], year, title, container, volume, issue, pages, doi} | null
   splitStatements({text}) -> string[]   (word for word; L1 kept; splits on . ! ? 。 ！ ？ ।)
   suggestLinks({bubbles, cards}) -> [{cardId, bubbleId, term}]   (faint hints only)
   nextStepPrompt({stage, paragraph}) -> string   (placeholder question, no judgment)
   decisionPrompt({level, tag, paragraph}) -> string   (sentence starter ending in "…")
   ========================================================= */
const STOP = new Set(('about above after again against their there these those which while would could should other also into from with that this were have been they them then than when what where your more most some such only very just over under both each between because through during before being does doing having here itself same student students').split(' '));
function terms(s){ return new Set((String(s).toLowerCase().match(/[a-zÀ-ɏ]{5,}/g) || []).filter(w=>!STOP.has(w))); }
const MockAI = {
  async parseReference({text}){
    const t = String(text).replace(/\s+/g,' ').trim();
    const m = t.match(/^(.+?)\s*\((\d{4}[a-z]?|n\.d\.)\)\.\s*(.+?[.?!])\s+((?:(?!\.\s)[^,])+?),\s*(\d+)(?:\s*\(([^)]+)\))?(?:,\s*([^.]+?))?\.\s*(\S+)?$/);
    if(!m) return null;
    const tokens = m[1].replace(/\s*&\s*/g,' ').replace(/\.\s*\.\s*\./g,'').split(/,\s*/).map(x=>x.trim()).filter(Boolean);
    const authors = [];
    for(let i=0;i<tokens.length;i++){
      const nx = tokens[i+1];
      if(nx && /^(\p{Lu}\.\s?-?\s?)+$/u.test(nx)){ authors.push({last:tokens[i], given:nx}); i++; }
      else authors.push({last:tokens[i], given:''});
    }
    return {authors, year:m[2], title:m[3].replace(/\.$/,''), container:m[4].trim(), volume:m[5], issue:m[6] || '', pages:m[7] || '',
      doi:(m[8] || '').replace(/^https?:\/\/(dx\.)?doi\.org\//,'')};
  },
  async splitStatements({text}){ return splitLocal(text); },
  async suggestLinks({bubbles, cards}){
    const out = [];
    for(const c of cards){
      const ct = terms(c.text); let best = null;
      for(const b of bubbles){
        for(const w of terms(b.text)){ if(ct.has(w) && (!best || w.length > best.term.length)) best = {cardId:c.id, bubbleId:b.id, term:w}; }
      }
      if(best) out.push(best);
    }
    return out.slice(0,6);
  },
  async nextStepPrompt({stage, paragraph}){
    const l = paragraph && paragraph.label ? '“' + paragraph.label + '”' : 'this part';
    const bank = {
      map:        'What do these cards say together?',
      themes:     'What would you call this group?',
      topics:     'What do these sources, together, say about ' + l + '?',
      synthesis:  'What do these chunks add up to that no single source says?',
      logic:      'How does the next part follow from ' + l + '?',
      conclusion: 'What is still missing in what you read?',
      explain:    'Reading it now, what does each part seem to do?'
    };
    return bank[stage] || 'What comes next?';
  },
  async decisionPrompt({level, tag}){
    const map = {
      Background:'You set this up as background so that readers…',
      Claim:'You made this your claim because…',
      Example:'You chose this evidence because…',
      Counterargument:'You brought in this other view because…',
      Transition:'You placed this link here so that…',
      Conclusion:'You end here because…'
    };
    return map[tag] || ('At the ' + levelName(level).toLowerCase() + ' level, you chose this because…');
  }
};
function splitLocal(text){
  return String(text).split(/\n+|(?<=[.!?。！？।])\s+/).map(s=>s.trim()).filter(s=>s.length>1);
}
const RemoteAI = {
  async call(task, payload){
    const r = await fetch(CONFIG.remoteEndpoint, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task, payload})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  },
  async parseReference(i){ return (await this.call('parse_reference', i)).source; },
  async splitStatements(i){ return (await this.call('split_statements', i)).statements; },
  async suggestLinks(i){ return (await this.call('suggest_links', i)).links; },
  async nextStepPrompt(i){ return (await this.call('next_step_prompt', {stage:i.stage, paragraph:i.paragraph && {label:i.paragraph.label}})).prompt; },
  async decisionPrompt(i){ return (await this.call('decision_prompt', {level:i.level, tag:i.tag})).prompt; }
};
let AI = CONFIG.aiMode === 'remote' ? RemoteAI : MockAI;
const promptCache = new Map();
async function ai(method, input, cacheKey){
  if(cacheKey && promptCache.has(cacheKey)) return promptCache.get(cacheKey);
  let out;
  try{ out = await AI[method](input); }
  catch(e){ Logger.log('ai_error', {method, message:String(e && e.message || e)}); out = await MockAI[method](input); }
  if(cacheKey) promptCache.set(cacheKey, out);
  return out;
}

/* =========================================================
   HELPERS
   ========================================================= */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function stageIndex(id){ return STAGES.findIndex(s=>s.id===id); }
function levelName(id){ return (LEVELS.find(l=>l.id===id) || {name:''}).name; }
function reduceMotion(){ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
function findP(id){ return state.paragraphs.find(p=>p.id===id); }
function items(){ return state.canvas.items; }
function itemById(id){ return items().find(i=>i.id===id); }
function cardsUnder(bid){ return items().filter(i=>i.kind==='card' && i.under===bid); }
function sourceById(id){ return state.sources.find(s=>s.id===id); }
function srcIndex(sid){ const k = state.sources.findIndex(s=>s.id===sid); return 's' + ((k < 0 ? 0 : k) % 6); }
function citeOf(sid){ const s = sourceById(sid); return s ? inText(s) : 'Removed source'; }
function stripParens(t){ return String(t).replace(/^\(|\)$/g,''); }
function srcChips(cards){
  const seen = []; for(const c of cards) if(!seen.includes(c.source)) seen.push(c.source);
  if(!seen.length) return '<p class="note">No sources stacked yet.</p>';
  const combined = '(' + seen.map(s=>stripParens(citeOf(s))).join('; ') + ')';
  return '<ul class="src-chips">' + seen.map(s=>'<li class="src-chip '+srcIndex(s)+'">'+esc(citeOf(s))+'</li>').join('') + '</ul>' +
    '<span class="cite-inline">'+esc(combined)+'</span>';
}
function styleGuide(key){
  const st = STYLES[key]; if(!st) return '';
  return '<ul class="guide">' + st.rules.map(r=>'<li><span>'+esc(r[0])+'</span><span><code>'+esc(r[1])+'</code></span></li>').join('') + '</ul>';
}
function guideDetails(){
  const st = STYLES[state.citationStyle]; if(!st) return '';
  return '<details class="style-guide"><summary>How '+esc(st.short)+' cites in the text</summary>'+styleGuide(state.citationStyle)+'</details>';
}

/* Citation formatting */
function authorsOf(s){ return (s.authors || []).filter(a=>a.last && a.last.trim()); }
function yearOf(s){ return String(s.year || '').trim() || 'n.d.'; }
function initialsOf(given){
  return String(given || '').trim().split(/\s+/).filter(Boolean)
    .map(t=>t.split('-').map(x=>{ const c = x.replace(/[^\p{L}]/gu,'').charAt(0); return c ? c.toUpperCase()+'.' : ''; }).filter(Boolean).join('-'))
    .filter(Boolean).join(' ');
}
function inText(s, narrative){
  const st = state.citationStyle || 'apa', a = authorsOf(s), y = yearOf(s);
  let names;
  if(!a.length) names = s.title ? '“' + s.title.trim().split(/\s+/).slice(0,4).join(' ') + '…”' : 'Untitled source';
  else if(a.length === 1) names = a[0].last.trim();
  else if(a.length === 2) names = a[0].last.trim() + ((narrative || st === 'chicago') ? ' and ' : ' & ') + a[1].last.trim();
  else names = a[0].last.trim() + ' et al.';
  if(narrative) return names + ' (' + y + ')';
  return st === 'apa' ? '(' + names + ', ' + y + ')' : '(' + names + ' ' + y + ')';
}
function doiUrl(d){ d = String(d || '').trim().replace(/^doi:\s*/i,''); if(!d) return ''; return /^10\./.test(d) ? 'https://doi.org/' + d : d; }
function endPunct(t, p){ return /[.?!]$/.test(t) ? t : t + p; }
function refParts(s){
  const st = state.citationStyle || 'apa', a = authorsOf(s), y = yearOf(s);
  const title = String(s.title || '').trim(), journal = String(s.container || '').trim();
  const vol = String(s.volume || '').trim(), iss = String(s.issue || '').trim(), pg = String(s.pages || '').trim().replace(/(\d)\s*[-‐‑]\s*(\d)/g,'$1–$2'), doi = doiUrl(s.doi);
  const parts = [];
  if(st === 'apa'){
    const list = a.map(x=>x.last.trim() + (initialsOf(x.given) ? ', ' + initialsOf(x.given) : ''));
    let au = '';
    if(list.length === 1) au = list[0];
    else if(list.length === 2) au = list[0] + ', & ' + list[1];
    else if(list.length > 20) au = list.slice(0,19).join(', ') + ', . . . ' + list.at(-1);
    else if(list.length) au = list.slice(0,-1).join(', ') + ', & ' + list.at(-1);
    if(au) parts.push(['author', esc(au)]);
    parts.push(['year', esc('(' + y + ').')]);
    if(title) parts.push(['title', esc(endPunct(title, '.'))]);
    if(journal){
      let loc = '';
      if(vol) loc += '<i>' + esc(vol) + '</i>' + (iss ? '(' + esc(iss) + ')' : '');
      if(pg) loc += (loc ? ', ' : '') + esc(pg);
      parts.push(['source', '<i>' + esc(journal) + '</i>' + (loc ? ',' : '.')]);
      if(loc) parts.push(['location', loc + '.']);
    }
    if(doi) parts.push(['doi', esc(doi)]);
  } else {
    const full = x => (x.given && x.given.trim() ? x.given.trim() + ' ' : '') + x.last.trim();
    const inv = x => x.last.trim() + (x.given && x.given.trim() ? ', ' + x.given.trim() : '');
    let au = '';
    if(a.length === 1) au = inv(a[0]);
    else if(a.length === 2) au = inv(a[0]) + ', and ' + full(a[1]);
    else if(a.length > 6) au = [inv(a[0]), full(a[1]), full(a[2])].join(', ') + ', et al.';
    else if(a.length) au = [inv(a[0])].concat(a.slice(1,-1).map(full)).join(', ') + ', and ' + full(a.at(-1));
    if(au) parts.push(['author', esc(endPunct(au, '.'))]);
    parts.push(['year', esc(y + '.')]);
    if(title) parts.push(['title', esc('“' + endPunct(title, '.') + '”')]);
    if(journal){
      const loc = ((vol ? vol : '') + (iss ? ' (' + iss + ')' : '') + (pg ? ': ' + pg.replace(/^article\s+/i,'') : '')).trim();
      parts.push(['source', '<i>' + esc(journal) + '</i>' + (loc ? '' : '.')]);
      if(loc) parts.push(['location', esc(loc) + '.']);
    }
    if(doi) parts.push(['doi', esc(doi) + '.']);
  }
  return parts;
}
function refHTML(s){ return refParts(s).map(p=>'<span class="rp rp-'+p[0]+'">'+p[1]+'</span>').join(' '); }
function refPlain(s){
  const d = document.createElement('div'); d.innerHTML = refParts(s).map(p=>p[1]).join(' '); return d.textContent;
}
function sortKey(s){ const a = authorsOf(s); return ((a[0] ? a[0].last : s.title || '') + ' ' + yearOf(s)).toLowerCase(); }
function legendHTML(){ return '<ul class="legend">' + REF_ROLES.map(r=>'<li><span class="rp rp-'+r[0]+'">'+esc(r[1])+'</span></li>').join('') + '</ul>'; }
function hlLines(s){ return String(s.highlights || '').split(/\n+/).map(l=>l.trim().replace(/^[-*•]\s*/,'')).filter(Boolean); }
function authorsText(s){ return (s.authors || []).map(a=>a.last + (a.given ? ', ' + a.given : '')).join('\n'); }
function sourceComplete(s){ return authorsOf(s).length && String(s.year||'').trim() && String(s.title||'').trim() && String(s.container||'').trim(); }
function citeBlock(s){
  return '<span class="mini">In the text</span><p class="ic-intext"><span>'+esc(inText(s))+'</span><span class="sep">·</span><span>'+esc(inText(s, true))+'</span></p>' +
    '<span class="mini">In the reference list</span><p class="ic-ref">'+refHTML(s)+'</p>';
}
function fieldHTML(s, key, label, opts){

function cue(msg, isCompletion){
  const t = $('#cue'); t.textContent = msg; t.classList.add('show');
  clearTimeout(cue._t); cue._t = setTimeout(()=>t.classList.remove('show'), 3800);
  if(isCompletion) Logger.log('completion_cue', {msg});
}

/* Stage change. Crossing into a new phase plays the metamorphosis:
   1) the old screen takes on the new phase's borders, highlighter and paper while keeping its font,
   2) it fades, 3) the new screen arrives in the new font. */
let morphing = false;
function go(stage){
  if(typeof stopLive === 'function') stopLive();
  const from = phaseOf(state.stage), to = phaseOf(stage);
  state.stage = stage; state.cursor = 0;
  Logger.log('stage_enter', {});
  save();
  if(from !== to && rendered && !reduceMotion()){
    morphing = true;
    Logger.log('phase_change', {from, to});
    main.style.setProperty('--f-content', 'var(--f-' + from + ')');
    document.body.dataset.phase = to;
    setTimeout(()=>{
      main.classList.add('morph-fade');
      setTimeout(()=>{
        main.style.removeProperty('--f-content');
        render(); window.scrollTo(0,0);
        main.classList.remove('morph-fade'); main.classList.add('morph-in');
        setTimeout(()=>{ main.classList.remove('morph-in'); morphing = false; }, 480);
      }, 230);
    }, 620);
    return;
  }
  render(); window.scrollTo(0,0);
}
function copyText(text, okMsg, fallbackEl){
  const fallback = () => {
    if(fallbackEl){ fallbackEl.focus(); fallbackEl.select(); cue('Copying is blocked here. The text is selected; press Ctrl+C or ⌘C.'); }
    else cue('Copying is blocked here. Open the session log and select the text there.');
  };
  try{ navigator.clipboard.writeText(text).then(()=>cue(okMsg), fallback); }
  catch(e){ fallback(); }
}

function seedSources(){

  state.sources = EXAMPLE_REFS.map(r=>({id:uid(), authors:r.authors.map(a=>({last:a[0], given:a[1]})), year:r.year,
    title:r.title[key], container:r.container, volume:r.volume, issue:r.issue, pages:r.pages, doi:r.doi, highlights:r.highlights.join('\n')}));
}
function blankSource(f){
  return Object.assign({id:uid(), authors:[], year:'', title:'', container:'', volume:'', issue:'', pages:'', doi:'', highlights:''}, f || {});
}
function approxRect(it){
  if(it.kind === 'card') return {x:it.x, y:it.y, w:CARD_W, h:CARD_H};
  return {x:it.x, y:it.y, w:STACK_W, h:72 + 26 * cardsUnder(it.id).length};
}
function overlaps(a, b){ return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }
function freeSlot(kind){
  const w = kind === 'card' ? CARD_W : STACK_W, h = kind === 'card' ? CARD_H : 90;
  const xs = [], ys = [];
  for(let x = 28; x <= UNSURE_X - w - 20; x += (kind === 'card' ? 236 : 262)) xs.push(x);
  if(kind === 'card'){ for(let y = 28; y <= ARCHIVE_Y - h - 20; y += 128) ys.push(y); }
  else { for(let y = ARCHIVE_Y - 200; y >= 28; y -= 150) ys.push(y); }
  const placed = items().filter(i=>!(i.kind==='card' && i.under)).map(approxRect);
  for(const y of ys) for(const x of xs){
    const r = {x, y, w, h};
    if(!placed.some(p=>overlaps(p, r))) return {x, y};
  }
  const n = items().length % 12;
  return {x:60 + n*16, y:60 + n*16};
}
function syncCards(){
  const parsed = state.sources.flatMap(s=>hlLines(s).map(t=>({source:s.id, text:t})));
  const pool = {};
  for(const c of items()) if(c.kind==='card' && !c.copyOf){ const k = c.source+'|'+c.text; (pool[k] = pool[k] || []).push(c); }
  const keep = new Set(), fresh = [];
  for(const p of parsed){
    const k = p.source+'|'+p.text;
    if(pool[k] && pool[k].length){ keep.add(pool[k].shift().id); }
    else fresh.push(p);
  }
  state.canvas.items = items().filter(i => i.kind !== 'card' || (i.copyOf ? keep.has(i.copyOf) : keep.has(i.id)));
  for(const p of fresh){
    const s = freeSlot('card');
    state.canvas.items.push({id:uid(), kind:'card', source:p.source, text:p.text, x:s.x, y:s.y, zone:'work', under:null, copyOf:null});
  }
  return {added:fresh.length, total:parsed.length};
}
function seedExample(){
  if(state.canvas.seeded) return;
  state.canvas.seeded = true;
  if(!state.isExample) return;
  const find = t => items().find(i=>i.kind==='card' && i.text.indexOf(t) === 0);
  const b1 = {id:uid(), kind:'bubble', text:BN.notOnlyGrammar, x:40, y:700, zone:'work'};
  items().push(b1);
  const g = find('Supervisors report problems'), s = find('Students struggle');
  if(g) g.under = b1.id; if(s) s.under = b1.id;
  items().push({id:uid(), kind:'bubble', text:BN.noOneExplains, x:620, y:700, zone:'work'});
}

/* Zoom */
function zoom(){ return state.canvas.zoom || 1; }
function fitZoom(widthOnly){
  const w = $('#board-wrap'); if(!w) return 1;
  const zw = (w.clientWidth - 4) / BW, zh = (w.clientHeight - 4) / BH;
  return clamp(widthOnly ? zw : Math.min(zw, zh), ZMIN, 1);
}
function applyZoom(z){
  z = clamp(Math.round(z * 100) / 100, ZMIN, ZMAX);
  state.canvas.zoom = z;
  const sizer = $('#board-sizer'), board = $('#board'), out = $('#zoom-val');
  if(sizer){ sizer.style.width = (BW * z) + 'px'; sizer.style.height = (BH * z) + 'px'; }
  if(board) board.style.transform = 'scale(' + z + ')';
  if(out) out.textContent = Math.round(z * 100) + '%';
  save();
}

function markNames(text){
  let html = esc(text);
  for(const w of new Set(findMentions(text).values())) html = html.replace(new RegExp('(^|[^\\p{L}])(' + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')(?=$|[^\\p{L}])','giu'), '$1<u>$2</u>');
  return html;
}
function hlText(t){ return '<span class="hl">'+esc(t)+'</span>'; }
const freshBubbles = [];
let lastSnap = null;
function renderBoard(){
  const board = $('#board'); if(!board) return;

function playFeedback(board){
  if(freshBubbles.length){
    freshBubbles.forEach((id, k)=>{ const el = board.querySelector('.item[data-id="'+id+'"] .bubble'); if(el) sparkle(el, k === 0); });
    freshBubbles.length = 0;
  }
  if(lastSnap){
    const bub = board.querySelector('.item[data-id="'+lastSnap.bubbleId+'"] .bubble');
    const chip = board.querySelector('[data-card-chip="'+lastSnap.cardId+'"]');
    if(bub && !reduceMotion()) bub.classList.add('clack');
    if(chip && !reduceMotion()) chip.classList.add('snapped');
    lastSnap = null;
  }
}

/* Feedback 1: sparkle ring on a new bubble (only the first bubble of one utterance gets the full ring). */
const STAR = '<svg viewBox="0 0 10 10" width="10" height="10"><path d="M5 0Q5 5 10 5Q5 5 5 10Q5 5 0 5Q5 5 5 0Z"/></svg>';
function sparkle(el, full){
  if(reduceMotion()) return;
  el.classList.add(full ? 'pop' : 'pop-quiet');
  if(!full) return;
  const halo = document.createElement('span'); halo.className = 'halo'; el.appendChild(halo);
  const W = el.offsetWidth, H = el.offsetHeight, n = 10;
  for(let k=0;k<n;k++){
    const a = k/n*2*Math.PI, s = document.createElement('span');
    s.className = 'sp'; s.innerHTML = STAR;
    s.style.left = (W/2 + Math.cos(a)*(W/2+2)) + 'px'; s.style.top = (H/2 + Math.sin(a)*(H/2+2)) + 'px';
    s.style.setProperty('--dx', Math.cos(a)*14 + 'px'); s.style.setProperty('--dy', Math.sin(a)*12 + 'px');
    s.style.setProperty('--s', k % 2 ? .7 : 1); s.style.animationDelay = (k % 2 ? 60 : 0) + 'ms';
    el.appendChild(s);
  }
  setTimeout(()=>{ el.querySelectorAll('.sp,.halo').forEach(x=>x.remove()); el.classList.remove('pop'); }, 1150);
}

/* Feedback 2: a hand-drawn pencil loop around each card the learner names. */
function drawLoop(el, delay, animate){
  el.querySelectorAll(':scope > .loop').forEach(x=>x.remove());
  const w = el.offsetWidth + 20, h = el.offsetHeight + 18, j = () => Math.random()*3 - 1.5;
  const d = 'M'+(w*0.55)+' '+(2+j())+' C'+(w*0.95)+' '+j()+' '+(w+3)+' '+(h*0.25)+' '+(w-1)+' '+(h*0.55)+' C'+(w-3)+' '+(h+1)+' '+(w*0.3)+' '+(h+2)+' '+(4+j())+' '+(h*0.7)+' C-2 '+(h*0.4)+' '+(w*0.1)+' 1 '+(w*0.5)+' '+(4+j())+' L'+(w*0.66)+' 0';
  const ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'loop' + (animate ? '' : ' static'));
  svg.setAttribute('width', w); svg.setAttribute('height', h); svg.setAttribute('viewBox', '0 0 '+w+' '+h); svg.setAttribute('aria-hidden', 'true');
  svg.style.left = '-10px'; svg.style.top = '-9px';
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.appendChild(p); el.appendChild(svg);
  const L = Math.ceil(p.getTotalLength ? p.getTotalLength() : 900);
  p.style.setProperty('--L', L); p.style.setProperty('--d', delay + 'ms');
}

/* =========================================================
   LIVE TALK: speech → bubbles, named sources get circled.
   Runs in the browser with no model call in the loop.
   ========================================================= */
function liveLang(){ return state.canvas.liveLang || 'en-US'; }
function fold(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function lev(a, b){
  const d = Array.from({length:b.length+1}, (_,j)=>j);
  for(let i=1;i<=a.length;i++){ let prev = d[0]; d[0] = i;
    for(let j=1;j<=b.length;j++){ const t = d[j]; d[j] = Math.min(d[j]+1, d[j-1]+1, prev + (a[i-1]===b[j-1]?0:1)); prev = t; } }
  return d[b.length];
}
function nameKeys(){
  const keys = [];
  for(const s of state.sources) for(const a of authorsOf(s)){
    const full = fold(a.last.trim());
    keys.push({k:full, sid:s.id, fuzzy:full.replace(/\s/g,'').length >= 6, phrase:/\s/.test(full)});
    if(/[\s-]/.test(full)) for(const part of full.split(/[\s-]+/)) if(part.length >= 4) keys.push({k:part, sid:s.id, fuzzy:false, phrase:false});
  }
  return keys;
}
/* Fuzzy matching tolerates small transcription slips in author names. Returns sid -> word as heard, in speaking order. */
function findMentions(text){
  const t = fold(text), words = t.match(/[a-z][a-z'-]*/g) || [], hits = [];
  for(const key of nameKeys()){
    let found = null;
    if(key.phrase){ if(t.includes(key.k)) found = key.k; }
    else for(const w of words){
      if(w === key.k || (key.fuzzy && w.length >= 5 && lev(w, key.k) <= (key.k.length >= 8 ? 2 : 1))){ found = w; break; }
    }
    if(found && !hits.some(h=>h.sid===key.sid)) hits.push({sid:key.sid, word:found, at:t.indexOf(found)});
  }
  hits.sort((a,b)=>a.at - b.at);
  return new Map(hits.map(h=>[h.sid, h.word]));
}
/* A loop stays until the learner names other sources. */
const mentioned = new Map(); // sid -> {t, order}
function noteMentions(text, via){
  const hits = findMentions(text); if(!hits.size) return hits;
  const now = Date.now(), ids = [...hits.keys()];
  for(const sid of [...mentioned.keys()]) if(!hits.has(sid)) mentioned.delete(sid);
  ids.forEach((sid, k)=>{
    if(!mentioned.has(sid)){ mentioned.set(sid, {t:now, order:k}); Logger.log('mention', {sid, via}); }
  });
  applyMentions();
  return hits;
}
function applyMentions(){
  const board = $('#board'); if(!board) return;
  const now = Date.now();
  board.querySelectorAll('.item.card').forEach(el=>{
    const c = itemById(el.dataset.id), m = c && mentioned.get(c.source);
    el.classList.toggle('mentioned', !!m);
    if(m){ if(!el.querySelector(':scope > .loop')) drawLoop(el, m.order * 250, now - m.t < 900); }
    else el.querySelectorAll(':scope > .loop').forEach(x=>x.remove());

function setLiveUI(on){

function startLive(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const unavailable = why => { stopLive(); Logger.log('live_unavailable', {why}); showCaption('Live speech is not available here (' + why + '). Use “Play a sample talk” to see how it works, or type instead.', true); };
  if(!SR) return unavailable('this browser has no speech recognition');
  try{
    rec = new SR();
    rec.lang = liveLang(); rec.continuous = true; rec.interimResults = true;
    rec.onresult = e => {
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){ const r = e.results[i]; if(r.isFinal) onFinal(r[0].transcript, 'speech'); else interim += r[0].transcript; }
      if(interim) onInterim(interim, 'speech'); else showCaption('Listening…', true);
    };
    rec.onerror = ev => { if(['not-allowed','service-not-allowed','audio-capture','network'].includes(ev.error)) unavailable('microphone or speech service blocked'); };
    rec.onend = () => { if(liveOn){ try{ rec.start(); }catch(e){ stopLive(); } } };
    rec.start(); liveOn = true; setLiveUI(true); showCaption('Listening…', true);
    Logger.log('live_start', {lang:rec.lang});
  }catch(e){ unavailable('could not start'); }
}

const SAMPLE_TALK = ['Hawari and Lin both point to the same problem.', BN.talk, 'And Mehar Singh says what students learned at home does not match.'];

  if(sampleRunning) return; sampleRunning = true; stopLive();

/* Geometry in board units (independent of zoom) */
function relRect(el){
  const board = $('#board'); if(!board || !el) return null;
  const b = board.getBoundingClientRect(), r = el.getBoundingClientRect(), z = zoom();
  return {x:(r.left - b.left)/z, y:(r.top - b.top)/z, w:r.width/z, h:r.height/z};
}
function stackGroups(){
  const board = $('#board'); if(!board) return [];
  const nodes = items().filter(i=>i.kind==='bubble' && i.zone==='work')
    .map(b=>({b, r:relRect(board.querySelector('.item[data-id="'+b.id+'"]'))})).filter(n=>n.r);
  const parent = nodes.map((_,i)=>i);
  const root = i => parent[i]===i ? i : (parent[i] = root(parent[i]));
  for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
    const a = nodes[i].r, c = nodes[j].r;
    const gx = Math.max(0, Math.max(a.x, c.x) - Math.min(a.x + a.w, c.x + c.w));
    const gy = Math.max(0, Math.max(a.y, c.y) - Math.min(a.y + a.h, c.y + c.h));
    if(gx <= LINK_GAP && gy <= LINK_GAP) parent[root(i)] = root(j);
  }
  const groups = {};
  nodes.forEach((n,i)=>{ (groups[root(i)] = groups[root(i)] || []).push(n); });
  return Object.values(groups);
}
function groupName(g){ const n = g.map(x=>x.b.theme).find(t=>t && t.trim()); return n || ''; }

    const x0 = Math.max(0, Math.min(...g.map(n=>n.r.x)) - 14), y0 = Math.max(0, Math.min(...g.map(n=>n.r.y)) - 46);
    const x1 = Math.max(...g.map(n=>n.r.x + n.r.w)) + 14, y1 = Math.max(...g.map(n=>n.r.y + n.r.h)) + 14;
    const ids = g.map(n=>n.b.id).join(',');

/* Themes */
function buildParagraphs(){
  const groups = stackGroups()
    .map(g=>({g, x:Math.min(...g.map(n=>n.r.x)), y:Math.min(...g.map(n=>n.r.y))}))
    .sort((a,b)=> (Math.round(a.y/160) - Math.round(b.y/160)) || (a.x - b.x));
  const old = state.paragraphs, used = new Set(), prev = {};
  old.forEach(p=>p.points.forEach((pt,k)=>{ prev[pt.bubbleId] = {purposeId:pt.purposeId || '', purposeNote:pt.purposeNote || '', link:pt.link || '', k}; }));
  state.paragraphs = groups.map(({g})=>{
    const ids = g.map(n=>n.b.id);
    let best = null, bestN = 0;
    for(const p of old){ if(used.has(p.id)) continue; const n = p.points.filter(pt=>ids.includes(pt.bubbleId)).length; if(n > bestN){ best = p; bestN = n; } }
    if(best) used.add(best.id);
    const base = best ? best : {id:uid(), label:'', topic:'', synthesis:'', link:'', marks:[]};
    const named = groupName(g);
    /* Chunk order: the learner's earlier order where it exists, otherwise top-to-bottom, left-to-right on the map. */
    const pts = g.slice().sort((a,b)=>{
      const pa = prev[a.b.id], pb = prev[b.b.id];
      if(best && pa && pb) return pa.k - pb.k;
      return (a.r.y - b.r.y) || (a.r.x - b.r.x);
    }).map(n=>{
      const was = prev[n.b.id] || {};
      return {bubbleId:n.b.id, text:n.b.text,
        cards:cardsUnder(n.b.id).map(c=>({id:c.id, source:c.source, text:c.text})),
        purposeId:was.purposeId || '', purposeNote:was.purposeNote || '', link:was.link || ''};
    });
    if(pts[0]) pts[0].link = '';
    return Object.assign({}, base, {points:pts}, named ? {label:named} : {});
  });
  Logger.log('themes_built', {n:state.paragraphs.length});
}

/* =========================================================
   REVIEW & REVISE
   1 Mark (point): the learner marks anything that feels off, at any level.
   2 Trace (line): for each mark, the tool lists the decisions connected to that spot by position.
     The learner picks the one that led there and says what they did and why. No inference, no judgment.
   3 Required decisions (whole): four global decisions every learner talks through, however many paragraphs.
   4 Revise in the same structural editor.
   ========================================================= */
const FLAG_KINDS = [{id:'wording',name:'Wording'},{id:'sentence',name:'A sentence'},{id:'structure',name:'How parts fit'},{id:'unsure',name:'Not sure'}];
function kindName(id){ return (FLAG_KINDS.find(k=>k.id===id) || {name:'Not sure'}).name; }
const GLOBALS = [
  {id:'landing',   name:'Where the review lands',             ask:'Why does your review land here?'},
  {id:'blocks',    name:'How you split it into paragraphs',   ask:'Is each paragraph about one theme? Why did you group the chunks this way?'},
  {id:'flow',      name:'Paragraph order and links',          ask:'Why this order, and why these links between paragraphs?'},
  {id:'tradeoffs', name:'What you left out',                  ask:'Why did you set these aside, or leave them unsure?'}
];
/* Decisions at the whole-review level, for the research log. */
const GLOBAL_DECISIONS = new Set(['landing','block','flow','plink','tradeoffs']);
let openFlag = null;
function rv(){ if(!state.review) state.review = {flags:[], globals:{}}; if(!state.review.globals) state.review.globals = {}; return state.review; }
function flowText(){ return state.paragraphs.map((p,i)=>(i ? '→ '+(relName(p.link) || 'no link')+' → ' : '')+roman(i+1)+'. '+p.label).join(' '); }
function leftOut(){ return items().filter(i=>(i.zone==='archive' || i.zone==='unsure') && !(i.kind==='card' && i.under)); }
function tradeoffText(){ const n = leftOut(); return n.length ? n.length+' item'+(n.length===1?'':'s')+' set aside or unsure' : 'Nothing set aside'; }
function purposesText(p){ return p.points.map((pt,k)=>letter(k)+'. '+(purposeLabel(pt) || '—')).join(' · '); }
function linksText(p){ return p.points.slice(1).map((pt,k)=>letter(k)+'→'+letter(k+1)+' '+(relName(pt.link) || '—')).join(' · ') || 'Only one chunk'; }
function parseKey(key){
  const [kind, pid, bid] = key.split(':'), ps = state.paragraphs, i = ps.findIndex(p=>p.id===pid), p = ps[i];
  const k = p && bid ? p.points.findIndex(x=>x.bubbleId===bid) : -1;
  return {kind, p, i, k, pt: k >= 0 ? p.points[k] : null};
}
function spotOf(key){
  const {kind, p, i, k, pt} = parseKey(key);
  if(kind === 'landing') return {where:'Where the review lands', text:state.conclusion};
  if(!p) return {where:'A part you have since removed', text:''};
  const P = 'Paragraph '+roman(i+1);
  if(kind === 'block') return {where:P+', the paragraph as a whole', text:p.label};
  if(kind === 'topic') return {where:P+', topic sentence', text:p.topic};
  if(kind === 'synth') return {where:P+', synthesis', text:p.synthesis};
  if(kind === 'plink') return {where:'Link into '+P, text:relName(p.link) || 'No relation named'};
  if(!pt) return {where:P+', a chunk you have since removed', text:''};
  if(kind === 'clink') return {where:P+', link into chunk '+letter(k), text:relName(pt.link) || 'No relation named'};
  return {where:P+', chunk '+letter(k), text:pt.text};
}
function decisionsFor(key){
  const {kind, p, i, k, pt} = parseKey(key), out = [], ps = state.paragraphs;
  const add = (id, label, detail) => out.push({id, label, detail:detail || '—'});
  const block = () => add('block', 'How you grouped this paragraph on the source map', p.points.length+' chunk'+(p.points.length===1?'':'s')+' under “'+p.label+'”');
  if(kind === 'landing'){
    add('landing', 'Where the review lands', state.conclusion);
    add('flow', 'Paragraph order and links', flowText());
    add('tradeoffs', 'What you set aside or left unsure', tradeoffText());
  } else if(!p){
  } else if(kind === 'block'){
    block(); add('label', 'The paragraph name', p.label); add('tradeoffs', 'What you set aside or left unsure', tradeoffText());
  } else if(kind === 'topic'){
    add('topic', 'The topic sentence you wrote', p.topic); block(); add('purposes', 'What each chunk does', purposesText(p));
  } else if(kind === 'synth'){
    add('synthesis', 'The synthesis you wrote', p.synthesis); add('purposes', 'What each chunk does', purposesText(p)); add('links', 'The links between chunks', linksText(p));
  } else if(kind === 'plink'){
    add('plink', 'The relation you chose', relName(p.link)); add('flow', 'Paragraph order', flowText());
    add('topics', 'The topic sentences on both sides', (ps[i-1] ? ps[i-1].topic : '')+'  /  '+p.topic);
  } else if(pt && kind === 'clink'){
    const prev = p.points[k-1];
    add('clink', 'The relation you chose', relName(pt.link)); add('corder', 'The order of the chunks', p.points.map((x,j)=>letter(j)).join(' → '));
    add('purpose2', 'What the two chunks do', (prev ? purposeLabel(prev) : '—')+'  /  '+(purposeLabel(pt) || '—'));
  } else if(pt){
    add('purpose', 'What this chunk does', purposeLabel(pt)); add('stack', 'Which sources you stacked under it', citesOf(pt));
    if(k > 0) add('clink', 'Its link to the chunk before', relName(pt.link));
    if(p.points[k+1]) add('clinkNext', 'The link from it to the next chunk', relName(p.points[k+1].link));
    add('corder', 'The order of the chunks', p.points.map((x,j)=>letter(j)).join(' → ')); block();
  }
  add('wording', 'Only the wording', 'How you put it, not what you decided');
  return out;
}

function movePara(pid, dir){
  const ps = state.paragraphs, i = ps.findIndex(p=>p.id===pid), j = i + dir;
  if(i<0 || j<0 || j>=ps.length) return;
  const tmp = ps[i]; ps[i] = ps[j]; ps[j] = tmp;
  const lo = Math.min(i,j), hi = Math.max(i,j); let cleared = 0;
  [lo, hi, hi+1].forEach(k=>{ const q = ps[k]; if(q && q.link){ q.link = ''; cleared++; } });
  Logger.log('reorder', {pid, from:i, to:j, linksCleared:cleared});
  save(); render();
  if(cleared) cue('Moved. Name the links around this paragraph again.');
  const btn = main.querySelector('[data-act="'+(dir<0?'up':'down')+'"][data-pid="'+pid+'"]');
  if(btn && !btn.disabled) btn.focus();
}
function usedSources(){
  const ids = new Set(); state.paragraphs.forEach(p=>p.points.forEach(pt=>pt.cards.forEach(c=>ids.add(c.source))));
  const list = state.sources.filter(s=>ids.has(s.id));
  return (list.length ? list : state.sources.filter(s=>hlLines(s).length)).slice().sort((a,b)=>sortKey(a) < sortKey(b) ? -1 : 1);
}
function outlineText(){
  const ps = state.paragraphs;
  const parts = ['Purpose: ' + state.purpose, 'Citation style: ' + ((STYLES[state.citationStyle]||{}).name || '—'), ''];
  ps.forEach((p,i)=>{
    parts.push((i+1)+'. '+p.label, '   Topic sentence: '+p.topic);
    p.points.forEach((pt,k)=>{
      const srcs = Array.from(new Set(pt.cards.map(c=>stripParens(citeOf(c.source))))).join('; ');
      const meta = [k > 0 && pt.link ? relName(pt.link) : '', purposeLabel(pt)].filter(Boolean).join(' · ');
      parts.push('   '+(i+1)+'.'+(k+1)+' '+(meta ? '['+meta+'] ' : '')+pt.text+(srcs ? ' ('+srcs+')' : ''));
    });
    if(p.synthesis) parts.push('   Synthesis: '+p.synthesis);
    if(i<ps.length-1 && ps[i+1].link) parts.push('   → Paragraph '+(i+2)+': '+relName(ps[i+1].link));
    parts.push('');
  });
  if(state.conclusion) parts.push('Where the review lands: '+state.conclusion);
  parts.push('', 'References');
  usedSources().forEach(s=>parts.push(refPlain(s)));
  return parts.join('\n');
}

/* Filing: the drawer pulls out, the finished paragraph shrinks into a folder,
   lifts over the drawer and slides in behind its front. Returns the duration. */
function fileAway(panel){
  if(!panel || reduceMotion() || !panel.animate) return 0;
  const cab = main.querySelector('.cabinet'), drawer = cab && cab.querySelector('.drawer');
  if(!drawer) return 0;
  cab.classList.add('open');
  panel.classList.add('filing');
  setTimeout(()=>{
    const a = panel.getBoundingClientRect(), t = drawer.getBoundingClientRect();
    const sx = (t.width - 16) / a.width, sy = 46 / a.height;
    const dx = t.left + 8 - a.left, dy = t.top - 50 - a.top;
    panel.style.transformOrigin = '0 0';
    panel.animate([
      {transform:'none', opacity:1},
      {transform:'translate('+(dx*0.6)+'px,'+(dy*0.6 - 30)+'px) scale('+(1 - (1 - sx)*0.6)+','+(1 - (1 - sy)*0.6)+')', opacity:1, offset:.55},
      {transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')', opacity:1, offset:.8},
      {transform:'translate('+dx+'px,'+(dy + 70)+'px) scale('+sx+','+sy+')', opacity:.85}
    ], {duration:600, easing:'cubic-bezier(.45,0,.2,1)', fill:'forwards'});
  }, 200);
  return 820;
}
/* A highlighter stroke is written under the button label before the action runs. */
function scribble(btn){
  const w = btn.offsetWidth * 0.82, ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('class', 'scribble'); svg.setAttribute('viewBox', '0 0 '+w+' 10'); svg.setAttribute('preserveAspectRatio', 'none'); svg.setAttribute('aria-hidden', 'true');
  const j = () => (Math.random()*2 - 1).toFixed(1);
  const d = 'M2 '+(6+ +j())+' C'+(w*0.25)+' '+(3+ +j())+' '+(w*0.45)+' '+(8+ +j())+' '+(w*0.62)+' '+(5+ +j())+' S'+(w*0.9)+' '+(3+ +j())+' '+(w-2)+' '+(6+ +j());
  const p = document.createElementNS(ns, 'path'); p.setAttribute('d', d); svg.appendChild(p); btn.appendChild(svg);
  p.style.setProperty('--L', Math.ceil(p.getTotalLength ? p.getTotalLength() : w + 20));
}

/* Board drag (pointer events: mouse, pen, touch). All positions in board units. */

/* Magnetic stacking: within SNAP_R a drop target pulls the dragged item toward it. */
function rectDist(p, r){ const dx = Math.max(r.x - p.x, 0, p.x - (r.x + r.w)), dy = Math.max(r.y - p.y, 0, p.y - (r.y + r.h)); return Math.hypot(dx, dy); }
function anchorOf(it, el, x, y){

  return {x:x + el.offsetWidth/2, y:y + el.offsetHeight/2};

function nearTarget(it, el, x, y){

    board.querySelectorAll('.item.card').forEach(c=>{
      const ci = itemById(c.dataset.id); if(!ci) return;
      const r = {x:ci.x, y:ci.y, w:c.offsetWidth, h:c.offsetHeight}, d = rectDist(p, r);
      if(d < SNAP_R && (!best || d < best.d)) best = {el:c, mark:c, id:c.dataset.id, r, d};
    });
  } else {
    board.querySelectorAll('.item.stack').forEach(s=>{
      if(s === el) return;
      const si = itemById(s.dataset.id); if(!si) return;
      const b = s.querySelector('.bubble');
      const r = {x:si.x + b.offsetLeft, y:si.y + b.offsetTop, w:b.offsetWidth, h:b.offsetHeight}, d = rectDist(p, r);
      if(d < SNAP_R && (!best || d < best.d)) best = {el:s, mark:s, id:s.dataset.id, r, d};

window.addEventListener('pointermove', e => {
  if(!drag) return;
  const board = $('#board'); if(!board){ drag = null; return; }
  const z = zoom();
  if(drag.block){
    if(!drag.started){
      if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
      drag.started = true;
      const hull = board.querySelector('[data-hull="'+drag.ids.join(',')+'"]'); if(hull) hull.classList.add('moving');
      drag.starts.forEach(s=>s.el.classList.add('dragging'));
    }
    e.preventDefault();
    let dx = (e.clientX - drag.sx)/z, dy = (e.clientY - drag.sy)/z;
    for(const s of drag.starts){ dx = clamp(dx, -s.x, BW - s.w - s.x); dy = clamp(dy, -s.y, BH - s.h - s.y); }
    drag.dx = dx; drag.dy = dy;
    drag.starts.forEach(s=>{ s.el.style.left = (s.x + dx) + 'px'; s.el.style.top = (s.y + dy) + 'px'; });
    return;
  }
  if(!drag.started){
    if(Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 5) return;
    drag.started = true;
    if(drag.chipId){
      const c = itemById(drag.chipId); if(!c){ drag = null; return; }
      drag.fromBubble = c.under; c.under = null; drag.id = c.id; drag.ox = 100; drag.oy = 20; drag.fromZone = 'stack';
      Logger.log('unstack', {cardId:c.id, bubbleId:drag.fromBubble});
      renderBoard();
    }
    drag.el = board.querySelector('.item[data-id="'+drag.id+'"]');
    if(!drag.el){ drag = null; return; }
    drag.el.classList.add('dragging');
  }
  e.preventDefault();
  const it = itemById(drag.id), p = boardPoint(e);
  const w = drag.el.offsetWidth, h = drag.el.offsetHeight;
  let x = clamp(p.x - drag.ox, 0, BW - w), y = clamp(p.y - drag.oy, 0, BH - h);
  board.querySelectorAll('.near').forEach(n=>n.classList.remove('near'));
  const t = nearTarget(it, drag.el, x, y);
  if(t){
    t.mark.classList.add('near');
    const pull = (1 - t.d / SNAP_R) * 0.6, cx = t.r.x + t.r.w/2, cy = t.r.y + t.r.h/2;
    x = clamp(x + (cx - t.p.x) * pull, 0, BW - w); y = clamp(y + (cy - t.p.y) * pull, 0, BH - h);
  }
  drag.target = t;
  drag.x = x; drag.y = y;
  drag.el.style.left = x + 'px'; drag.el.style.top = y + 'px';
}, {passive:false});
function centerOf(r){ return {x:r.x + r.w/2, y:r.y + r.h/2}; }
function endDrag(){
  if(!drag) return;

    for(const s of d.starts){
      const it = itemById(s.id); if(!it) continue;
      it.x = s.x + d.dx; it.y = s.y + d.dy;
      const c = centerOf(relRect(s.el.querySelector('.bubble')));
      it.zone = zoneOf(c.x, c.y);
