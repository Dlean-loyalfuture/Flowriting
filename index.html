    Logger.log('move_block', {n:d.ids.length, dx:Math.round(d.dx), dy:Math.round(d.dy)});
    save(); renderBoard(); return;
  }
  const it = itemById(d.id); if(!it){ renderBoard(); return; }
  it.x = d.x; it.y = d.y;
  const c = anchorOf(it, d.el, d.x, d.y);
  it.zone = zoneOf(c.x, c.y);
  const target = d.target;
  if(target){
    const bubbleId = it.kind === 'bubble' ? it.id : target.id;
    const cardId = it.kind === 'bubble' ? target.id : it.id;
    const card = itemById(cardId); card.under = bubbleId;
    lastSnap = {bubbleId, cardId};
    const viaHint = currentHints.some(h=>h.cardId===cardId && h.bubbleId===bubbleId);
    Logger.log('stack', {bubbleId, cardId, viaHint});
    if(!items().some(i=>i.kind==='card' && i.under && i.id!==cardId)) cue('Stacked. Keep stacks that belong together close.');
  }
  Logger.log('canvas_move', {id:it.id, kind:it.kind, fromZone:d.fromZone, zone:it.zone, x:Math.round(it.x), y:Math.round(it.y)});
  save(); renderBoard();
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

/* Write-forward tracking: characters added vs deleted per focus session */
let typing = null;
main.addEventListener('focusin', e => {
  const el = e.target.closest('[data-track]');
  typing = el ? {field:el.dataset.track, pid:el.dataset.pid || null, added:0, deleted:0, start:Date.now()} : null;
});
main.addEventListener('beforeinput', e => {
  if(!typing) return;
  const el = e.target;
  if(e.inputType.startsWith('delete')){
    const sel = (el.selectionEnd || 0) - (el.selectionStart || 0);
    typing.deleted += Math.max(1, sel);
  } else if(e.data){ typing.added += e.data.length; }
  else if(e.dataTransfer){ typing.added += (e.dataTransfer.getData('text') || '').length; }
  else if(e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph'){ typing.added += 1; }
});
main.addEventListener('focusout', () => {
  if(typing && (typing.added || typing.deleted)) Logger.log('typing', {field:typing.field, pid:typing.pid, added:typing.added, deleted:typing.deleted, ms:Date.now()-typing.start});
  typing = null;
});

/* Hold to peek */
let peekStart = 0;
function peekOn(e){ if(!e.target.closest('[data-peek]')) return; main.classList.add('peeking'); peekStart = Date.now(); }
function peekOff(){ if(!peekStart) return; main.classList.remove('peeking'); Logger.log('peek', {ms:Date.now()-peekStart}); peekStart = 0; }
main.addEventListener('pointerdown', peekOn);
['pointerup','pointercancel','pointerleave'].forEach(t=>main.addEventListener(t, peekOff));
main.addEventListener('keydown', e => { if((e.key===' '||e.key==='Enter') && e.target.closest('[data-peek]') && !peekStart){ e.preventDefault(); peekOn(e); } });
main.addEventListener('keyup', e => { if((e.key===' '||e.key==='Enter') && e.target.closest('[data-peek]')) peekOff(); });

/* =========================================================
   SESSION LOG (research view)
   ========================================================= */
function metrics(){
  const typingEv = state.log.filter(e=>e.type==='typing');
  const added = typingEv.reduce((a,e)=>a+e.added,0), deleted = typingEv.reduce((a,e)=>a+e.deleted,0);
  const R = state.review || {flags:[], globals:{}};
  const byKind = {}; FLAG_KINDS.forEach(k=>byKind[k.id]=0); R.flags.forEach(f=>byKind[f.kind]=(byKind[f.kind]||0)+1);
  const traceLevel = {global:0, local:0, wording:0, none:0};
  R.flags.forEach(f=>{ const d = f.trace && f.trace.decision; if(!d) return; const lv = GLOBAL_DECISIONS.has(d) ? 'global' : (d === 'wording' || d === 'none' ? d : 'local'); traceLevel[lv]++; });
  const revEv = state.log.filter(e=>e.stage==='review');
  const revStructure = revEv.filter(e=>['chunk_purpose','chunk_link','chunk_reorder','paragraph_link','reorder'].includes(e.type)).length;
  const revWording = revEv.filter(e=>e.type==='typing' && ['topic','synthesis','label','conclusion','chunk-note'].includes(e.field)).length;
  const globalChoices = GLOBALS.map(g=>g.name+': '+((R.globals[g.id]||{}).choice || '—'));
  const bubbles = items().filter(i=>i.kind==='bubble');
  const stacked = bubbles.map(b=>cardsUnder(b.id)).filter(a=>a.length);
  const srcPer = stacked.length ? (stacked.reduce((a,cs)=>a+new Set(cs.map(c=>c.source)).size,0)/stacked.length).toFixed(2) : '—';
  const pts = state.paragraphs.flatMap(p=>p.points);
  const byRel = {}, paraRel = {}; RELATIONS.forEach(r=>{ byRel[r.id]=0; paraRel[r.id]=0; });
  pts.forEach(pt=>{ if(pt.link) byRel[pt.link] = (byRel[pt.link]||0) + 1; });
  state.paragraphs.slice(1).forEach(q=>{ if(q.link) paraRel[q.link] = (paraRel[q.link]||0) + 1; });
  return {
    paraRel, chunks:pts.length, purposed:pts.filter(hasPurpose).length, ownWords:pts.filter(pt=>String(pt.purposeNote||'').trim()).length, byRel,
    added, delRate: added ? (deleted/added*100).toFixed(1) : '0.0',
    peeks: state.log.filter(e=>e.type==='peek').length,
    versions: state.versions.length,
    moves: state.log.filter(e=>e.type==='canvas_move').length,
    stacks: state.log.filter(e=>e.type==='stack').length,
    srcPer,
    aside: items().filter(i=>i.zone==='archive' && !(i.kind==='card' && i.under)).length,
    unsure: items().filter(i=>i.zone==='unsure' && !(i.kind==='card' && i.under)).length,
    hintFollows: state.log.filter(e=>e.type==='stack' && e.viaHint).length,
    flags:R.flags.length, byKind, traceLevel, revStructure, revWording, globalChoices
  };
}
function jumpTo(stage){
  if(stageIndex(stage) >= stageIndex('sources')){ if(!state.citationStyle) state.citationStyle = 'apa'; seedSources(); }
  if(stageIndex(stage) >= stageIndex('map')){ syncCards(); seedExample(); }
  if(stageIndex(stage) > stageIndex('map') && !state.paragraphs.length) return;
  Logger.log('preview_jump', {to:stage});
  logPanel.hidden = true;
  go(stage);
}
/* Example walkthrough: fills every screen. full = also decision marks, an explanation and zones on the map. */
function buildSample(full){
  if(!state.citationStyle) state.citationStyle = 'apa';
  if(!state.sources.length){ state.isExample = true; state.sourcesSeeded = false; }
  seedSources(); syncCards(); state.canvas.seeded = true;
  const card = t => items().find(i=>i.kind==='card' && i.text.indexOf(t) === 0);
  const place = (t, x, y, zone) => { const c = card(t); if(c){ c.x = x; c.y = y; c.zone = zone; c.under = null; } };
  const bubble = (t, x, y) => { let b = items().find(i=>i.kind==='bubble' && i.text.indexOf(t) === 0);
    if(!b){ b = {id:uid(), kind:'bubble', text:t, x, y, zone:'work'}; items().push(b); } b.x = x; b.y = y; b.zone = 'work'; return b; };
  const b1 = bubble(BN.notOnlyGrammar, 70, 120);
  const b2 = bubble('Students and faculty look at different levels', 336, 120);
  const b3 = bubble('Students get little explicit writing instruction', 602, 120);
  const b4 = bubble(BN.noOneExplains, 70, 470);
  const b5 = bubble('What students learned at home does not match', 336, 470);
  [[b1,'Supervisors report problems'],[b1,'Students struggle'],[b2,'Students worry most'],[b3,'EAL doctoral'],[b4,'Success depends'],[b5,'Home literacy']]
    .forEach(([b,t])=>{ const c = card(t); if(c) c.under = b.id; });
  if(full){
    place('Supervisors also see', UNSURE_X + 30, 60, 'unsure');
    place('Some student strategies', UNSURE_X + 30, 220, 'unsure');
    place('Methodology and discussion', 420, ARCHIVE_Y + 18, 'archive');
  }
  b1.theme = b2.theme = b3.theme = 'Language and structure'; b4.theme = b5.theme = 'Unspoken expectations';
  const pt = (b, purposeId, link, purposeNote) => ({bubbleId:b.id, text:b.text, cards:cardsUnder(b.id).map(c=>({id:c.id, source:c.source, text:c.text})),
    purposeId, purposeNote:purposeNote || '', link:link || ''});
  const P1 = uid(), P2 = uid();
  state.paragraphs = [
    {id:P1, label:'Language and structure',
     topic:'Graduate writers struggle with more than grammar: thesis structure and a lack of explicit instruction matter as much.',
     points:[pt(b1,'common'), pt(b2,'different','contrast'), pt(b3,'gap','explain')],
     synthesis:'Taken together, the difficulty lies less in grammar than in knowing what structure is expected, and students are rarely taught it.',
     link:'', marks:[]},
    {id:P2, label:'Unspoken expectations',
     topic:'Graduate writing expectations are rarely made explicit to international students.',
     points:[pt(b4,'common'), pt(b5,'evidence','explain','why expectations feel hidden')],
     synthesis:'Expectations stay tacit, so students fall back on what worked at home; making them explicit is part of the support they need.',
     link:'explain', marks:[]}
  ];
  state.conclusion = 'Few studies look at support during the writing process itself, between knowledge-focused workshops and feedback on finished drafts.';
  /* A sample review: one mark traced to a decision, and one required decision discussed. */
  state.review = full ? {
    flags:[{id:uid(), key:'clink:'+P1+':'+b2.id, kind:'structure', note:BN.flagNote, t:Date.now(),
            trace:{decision:'clink', why:'I picked Contrast because students and faculty look at different levels. Maybe it is one problem seen from two sides, so Extends could fit better.'}}],
    globals:{landing:{choice:'keep', why:'It answers my purpose: support during the writing process is what is missing.'}}
  } : {flags:[], globals:{}};
  state.cursor = 0;
}
function loadSampleOutline(){
  buildSample(false);
  Logger.log('sample_outline', {}); save();
  cue('Sample outline loaded. Pick a screen to preview.');
}
function exportData(){ return Object.assign({exportedAt:new Date().toISOString(), aiMode:CONFIG.aiMode}, state); }
function renderLog(){
  const m = metrics();
  const metric = (label, v) => '<div class="metric"><b>'+esc(v)+'</b>'+label+'</div>';
  logPanel.innerHTML =
    '<div class="lp-head"><h2 class="panel-title">Session log</h2><button type="button" class="link-btn" id="lp-close">Close</button></div>' +
    '<p class="note">For the research team. AI: '+(CONFIG.aiMode==='mock'?'built-in example logic, no model connected.':'connected model.')+'</p>' +
    '<div class="panel"><label class="field-label" for="jump">Preview a screen</label>' +
      '<div class="talk-row"><select id="jump" style="flex:1">' + STAGES.map(st=>{
        const need = stageIndex(st.id) > stageIndex('map') && !state.paragraphs.length;
        return '<option value="'+st.id+'"'+(st.id===state.stage?' selected':'')+(need?' disabled':'')+'>'+esc(st.name)+(need?' (needs an outline)':'')+'</option>';
      }).join('') + '</select><button type="button" class="secondary" id="jump-go">Go</button></div>' +
      (state.paragraphs.length ? '' : '<button type="button" class="ghost-btn" id="load-sample">Load a sample outline</button><p class="note">Fills the later screens with sample content so you can preview them.</p>') +
      '<p class="note">For checking screens only. Jumps are logged.</p></div>' +
    '<div class="metrics">' +
      metric('Characters typed', m.added) + metric('Deletions per 100 typed', m.delRate) +
      metric('Card moves on the map', m.moves) + metric('Stacking actions', m.stacks) +
      metric('Sources per statement', m.srcPer) + metric('Hints followed', m.hintFollows) +
      metric('Set aside / not sure', m.aside + ' / ' + m.unsure) + metric('Peeks', m.peeks) +
      metric('Versions saved', m.versions) + metric('Review marks', m.flags) +
      metric('Revisions in review: structure / wording', m.revStructure + ' / ' + m.revWording) +
      metric('Chunks with a purpose', m.purposed + ' / ' + m.chunks) + metric('Purposes in own words', m.ownWords) +
    '</div>' +
    '<div><span class="mini">Links by relation: within paragraphs / between paragraphs</span>' + RELATIONS.map(r=>'<span class="pill alt" style="margin:2px 4px 2px 0;display:inline-block">'+esc(r.name)+': '+m.byRel[r.id]+' / '+m.paraRel[r.id]+'</span>').join('') + '</div>' +
    '<div><span class="mini">Review marks by what felt off</span>' + FLAG_KINDS.map(k=>'<span class="pill alt" style="margin:2px 4px 2px 0;display:inline-block">'+esc(k.name)+': '+m.byKind[k.id]+'</span>').join('') + '</div>' +
    '<div><span class="mini">Marks traced to decisions, by level</span>' + Object.keys(m.traceLevel).map(k=>'<span class="pill alt" style="margin:2px 4px 2px 0;display:inline-block">'+esc(k)+': '+m.traceLevel[k]+'</span>').join('') + '</div>' +
    '<div><span class="mini">Required decisions</span>' + m.globalChoices.map(t=>'<span class="pill alt" style="margin:2px 4px 2px 0;display:inline-block">'+esc(t)+'</span>').join('') + '</div>' +
    '<div><span class="mini">Latest events</span><pre class="ev">'+esc(state.log.slice(-40).map(e=>new Date(e.t).toLocaleTimeString()+'  '+e.stage+'  '+e.type).join('\n') || 'No events yet.')+'</pre></div>' +
    '<label class="field-label" for="export-json">Session data (JSON)</label>' +
    '<textarea id="export-json" class="json" readonly>'+esc(JSON.stringify(exportData(), null, 2))+'</textarea>' +
    '<button type="button" class="secondary" id="copy-json">Copy session data</button>';
}
logPanel.addEventListener('click', e => {
  if(e.target.id === 'lp-close'){ logPanel.hidden = true; $('#btn-log').focus(); }
  if(e.target.id === 'jump-go'){ jumpTo($('#jump').value); return; }
  if(e.target.id === 'load-sample'){ loadSampleOutline(); renderLog(); return; }
  if(e.target.id === 'copy-json'){ copyText(JSON.stringify(exportData(), null, 2), 'Session data copied.', $('#export-json')); }
});
$('#btn-log').addEventListener('click', () => { logPanel.hidden = !logPanel.hidden; if(!logPanel.hidden){ renderLog(); $('#lp-close').focus(); } });
let resetArmed = null;
$('#btn-reset').addEventListener('click', e => {
  const b = e.currentTarget;
  if(!resetArmed){
    b.textContent = 'Click again to clear everything';
    resetArmed = setTimeout(()=>{ b.textContent = 'Start over'; resetArmed = null; }, 3500);
    return;
  }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = 'Start over';
  state = blankState(); promptCache.clear(); mentioned.clear();
  if(CONFIG.demo) buildSample(true);
  try{ localStorage.removeItem(CONFIG.storageKey); }catch(err){}
  logPanel.hidden = true; render(); window.scrollTo(0,0);
});
window.addEventListener('resize', ()=>{ if(state.stage === 'map'){ renderBoard(); } });

if(CONFIG.demo && !saved){ buildSample(true); save(); }

window.WriteFlow = {
  CONFIG, Logger, MockAI, RemoteAI, STYLES, inText, refParts,
  setAI(adapter){ AI = adapter; promptCache.clear(); },
  getState(){ return state; }
};

render();
})();
</script>
